# Near Wheels — Google Cloud Build pipeline
# Builds the Docker image and deploys it to Cloud Run.
#
# Edit the two <REPLACE> values below (they are also passed by gcloud builds submit
# via --substitutions, so you don't need to edit this file if you use deploy.sh).

steps:
  # 1. Build the image and push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_RAZORPAY_KEY_ID=${_NEXT_PUBLIC_RAZORPAY_KEY_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_SITE_URL}'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/near-wheels/near-wheels:${_TAG}'
      - '.'
    timeout: '1200s'

  # 2. Deploy to Cloud Run (zero-downtime, requests-per-second autoscaling)
  # Razorpay secrets are OPTIONAL — leave them empty and the app runs in simulated mode.
  # When you get Razorpay credentials, update them in Secret Manager and uncomment below.
  # Uploads are written to UPLOAD_DIR (default /tmp/uploads, writable on Cloud Run).
  # For persistent uploads, also add:
  #   --add-volume=name=uploads,type=cloud-storage,bucket=YOUR_BUCKET \
  #   --add-volume-mount=volume=uploads,mount-path=/tmp/uploads
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy near-wheels \
          --image="$_REGION-docker.pkg.dev/$$PROJECT_ID/near-wheels/near-wheels:$${_TAG}" \
          --region="$_REGION" \
          --platform=managed \
          --allow-unauthenticated \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=10 \
          --port=8080 \
          --service-account="$_SERVICE_ACCOUNT" \
          --set-env-vars="DATABASE_URL=$${_DATABASE_URL},SESSION_SECRET=$${_SESSION_SECRET},ADMIN_PHONE=$${_ADMIN_PHONE},ADMIN_PASSWORD=$${_ADMIN_PASSWORD},DEMO_CUSTOMER_PHONE=$${_DEMO_CUSTOMER_PHONE},GEMINI_API_KEY=$${_GEMINI_API_KEY},GEMINI_MODEL=$${_GEMINI_MODEL},PAYMENT_MODE=$${_PAYMENT_MODE},NEXT_PUBLIC_RAZORPAY_KEY_ID=$${_RAZORPAY_KEY_ID},RAZORPAY_KEY_ID=$${_RAZORPAY_KEY_ID},RAZORPAY_KEY_SECRET=$${_RAZORPAY_KEY_SECRET},RAZORPAY_WEBHOOK_SECRET=$${_RAZORPAY_WEBHOOK_SECRET},PAYMENT_WEBHOOK_SECRET=$${_PAYMENT_WEBHOOK_SECRET},UPLOAD_DIR=$${_UPLOAD_DIR}"

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/near-wheels/near-wheels:${_TAG}'

substitutions:
  _REGION: us-central1
  _TAG: latest
  _NEXT_PUBLIC_RAZORPAY_KEY_ID: ''
  _NEXT_PUBLIC_SITE_URL: https://nearwheels.example.com
  _SERVICE_ACCOUNT: ''
  _DATABASE_URL: ''
  _SESSION_SECRET: ''
  _ADMIN_PHONE: ''
  _ADMIN_PASSWORD: ''
  _DEMO_CUSTOMER_PHONE: ''
  _GEMINI_API_KEY: ''
  _GEMINI_MODEL: gemini-1.5-flash
  _PAYMENT_MODE: simulated
  _RAZORPAY_KEY_ID: ''
  _RAZORPAY_KEY_SECRET: ''
  _RAZORPAY_WEBHOOK_SECRET: ''
  _PAYMENT_WEBHOOK_SECRET: ''
  _UPLOAD_DIR: /tmp/uploads

options:
  dynamic_substitutions: true
  logging: CLOUD_LOGGING_ONLY