name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
    validations:
      required: true
  - type: dropdown
    id: vertical
    attributes:
      label: Which area
      options:
        - Ride sharing
        - Vehicle rental
        - Garages
        - Driving school
        - Drone / farm services
        - Yatra buses
        - Payments or payouts
        - Auth / login
        - Admin panel
        - AI features
        - Infrastructure or deployment
        - Cross-cutting
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to implement this
