name: Good first issue
description: A small, well-scoped task for a first contribution
labels: ["good first issue", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        This template is for changes small enough to be a first contribution.

        **What makes a good first issue:** a single file, a clear expected outcome, and
        something you can verify yourself. If your fix needs more than a couple of hours
        or touches the payment or booking logic, comment on the issue first and we'll
        scope it down together.
  - type: textarea
    id: problem
    attributes:
      label: What needs to change
      description: What is missing or wrong today?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: How you plan to approach it
      description: A sentence or two. This is not a gate — it helps us avoid sending you somewhere awkward.
  - type: checkboxes
    id: setup
    attributes:
      label: Before starting
      options:
        - label: I have read CONTRIBUTING.md
          required: true
        - label: I can run the app locally with `docker compose up -d`
        - label: I can run `npm test` successfully
